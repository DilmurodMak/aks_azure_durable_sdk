apiVersion: v1
kind: Namespace
metadata:
  name: durable-spike
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: durable-worker
  namespace: durable-spike
  annotations:
    azure.workload.identity/client-id: "__AZURE_CLIENT_ID__"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-worker
  namespace: durable-spike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: approval-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: approval-worker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: durable-worker
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: "__WORKER_IMAGE__"
          imagePullPolicy: IfNotPresent
          env:
            - name: ENDPOINT
              value: "__ENDPOINT__"
            - name: TASKHUB
              value: "__TASKHUB__"
            - name: SCHEDULER_AUTH
              value: WorkloadIdentity
            - name: AZURE_CLIENT_ID
              value: "__AZURE_CLIENT_ID__"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
