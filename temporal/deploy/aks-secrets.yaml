apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal-secrets
  namespace: temporal-spike
  annotations:
    azure.workload.identity/client-id: "__PROVISIONER_CLIENT_ID__"
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: temporal-secrets
  namespace: temporal-spike
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [temporal-db, temporal-db-bootstrap]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: temporal-secrets
  namespace: temporal-spike
subjects:
  - kind: ServiceAccount
    name: temporal-secrets
    namespace: temporal-spike
roleRef:
  kind: Role
  name: temporal-secrets
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-secrets-egress
  namespace: temporal-spike
spec:
  podSelector:
    matchLabels: {app: temporal-secrets}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: temporal-secrets
  namespace: temporal-spike
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 240
  template:
    metadata:
      labels:
        app: temporal-secrets
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: temporal-secrets
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: sync
          image: "__TEMPORAL_IMAGE__"
          command: ["python", "-m", "approval.azure_secrets"]
          env:
            - {name: TEMPORAL_KEY_VAULT, value: "__KEY_VAULT__"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
