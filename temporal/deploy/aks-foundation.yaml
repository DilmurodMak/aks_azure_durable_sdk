apiVersion: v1
kind: Namespace
metadata:
  name: temporal-spike
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: temporal-budget
  namespace: temporal-spike
spec:
  hard:
    requests.cpu: "3"
    requests.memory: 6Gi
    limits.cpu: "6"
    limits.memory: 8Gi
    requests.storage: 5Gi
    pods: "15"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: temporal
  namespace: temporal-spike
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-temporal
  namespace: temporal-spike
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 10.0.8.0/27
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: console-data
  namespace: temporal-spike
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi
